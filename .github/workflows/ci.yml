name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Estilo y errores comunes (Biome)
        run: npm run lint
      - name: Pruebas de lógica (Vitest)
        run: npm test
      - name: Navegador para las pruebas de punta a punta
        run: npx playwright install --with-deps chromium
      - name: Pruebas de punta a punta (Playwright)
        run: npm run test:e2e
      - name: Build de la página para Claude
        run: npm run build:artifact
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reporte-playwright
          path: test-results/
          retention-days: 7
