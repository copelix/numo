name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04  # Playwright 1.56 todavía no soporta 26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas de lógica (Vitest)
        run: npm test
      - name: Navegador para las pruebas de punta a punta
        run: npx playwright install --with-deps chromium
      - name: Pruebas de punta a punta (Playwright)
        run: npm run test:e2e
      - name: Build de la página para Claude
        run: npm run build:artifact
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reporte-playwright
          path: test-results/
          retention-days: 7
